[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nych"
version = "0.2.0"
description = "NYCH symbolic substrate with an executable canonical MG8 reference profile"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Nicholas Hartman" }
]
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.24"
]

[tool.setuptools]
packages = ["nych", "nych_mg8"]

[project.scripts]
nych = "nych.cli:main"
nych-mg8 = "nych_mg8.cli:main"
