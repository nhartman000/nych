[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nych"
version = "0.1.0"
description = "NYCH deterministic symbolic language and visualization substrate"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Nicholas Hartman" }
]
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.24"
]

[tool.setuptools]
packages = ["nych"]

[project.scripts]
nych = "nych.cli:main"
