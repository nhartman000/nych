name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Run MG8 format checks
        run: python tests/test_mg8_formats.py
      - name: Run MG8 runtime checks
        run: python tests/test_mg8_runtime.py
      - name: Run NYCH codec checks
        run: python tests/test_mg8_symbol_codec.py
      - name: Smoke-test CLI inspection
        run: nych inspect
      - name: Smoke-test MG8 execution
        run: nych-mg8 demo-gate --output-dir /tmp/nych-mg8-demo
